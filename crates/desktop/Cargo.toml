[package]
name = "opencorel-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
opencorel-core = { path = "../core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

opencorel-export = { path = "../export" }

earcutr = "0.5"

rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }

opencorel-formats = { path = "../formats" }
resvg = "0.48"

image = { version = "0.25", default-features = false, features = ["png","jpeg"] }
base64 = "0.22"

lyon_tessellation = "1.0"
opencorel-typography = { path = "../typography" }

[dev-dependencies]
tempfile = "3"
