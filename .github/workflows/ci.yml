name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev
      - name: Tests
        run: cargo test --workspace
      - name: Release-mode tests
        run: cargo test --release --workspace
      - name: Static Rust analysis
        run: cargo clippy --workspace --all-targets
      - name: Build desktop
        run: cargo build --release -p opencorel-desktop
      - name: Build CLI
        run: cargo build --release -p opencorel-cli
      - name: CLI smoke — native project, PLT and DXF
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -p opencorel-cli -- new ci-smoke.kdr
          cargo run --release -p opencorel-cli -- inspect ci-smoke.kdr
          cargo run --release -p opencorel-cli -- export-svg ci-smoke.kdr ci-smoke.svg
          grep -q '<svg' ci-smoke.svg
          cargo run --release -p opencorel-cli -- add-page ci-smoke.kdr ci-multipage.kdr 210 297
          cargo run --release -p opencorel-cli -- pages ci-multipage.kdr > ci-pages.txt
          grep -q '^2 | id=2' ci-pages.txt
          cargo run --release -p opencorel-cli -- duplicate-page ci-multipage.kdr ci-multipage-3.kdr
          cargo run --release -p opencorel-cli -- pages ci-multipage-3.kdr > ci-pages3.txt
          grep -q '^3 | id=3' ci-pages3.txt
          mkdir -p ci-pages-svg ci-pages-pdf
          cargo run --release -p opencorel-cli -- batch-svg ci-multipage-3.kdr ci-pages-svg
          cargo run --release -p opencorel-cli -- batch-pdf ci-multipage-3.kdr ci-pages-pdf
          cargo run --release -p opencorel-cli -- export-pdf-book ci-multipage-3.kdr ci-book.pdf
          python -m pip install --disable-pip-version-check --no-input pypdf
          python -c 'from pypdf import PdfReader; assert len(PdfReader("ci-book.pdf").pages) == 3'

          test "$(find ci-pages-svg -name '*.svg' | wc -l | tr -d ' ')" -eq 3
          test "$(find ci-pages-pdf -name '*.pdf' | wc -l | tr -d ' ')" -eq 3
          if cargo run --release -p opencorel-cli -- batch-svg ci-multipage-3.kdr ci-pages-svg; then
            echo 'Batch export should refuse to overwrite existing files' >&2
            exit 1
          fi
          cargo run --release -p opencorel-cli -- import-svg ci-smoke.svg ci-smoke-import.kdr
          cargo run --release -p opencorel-cli -- inspect ci-smoke-import.kdr
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100"><rect x="10" y="10" width="40" height="40" stroke="#000000" stroke-width="1" fill="none"/></svg>' > ci-plot.svg
          cargo run --release -p opencorel-cli -- import-svg ci-plot.svg ci-plot.kdr
          cargo run --release -p opencorel-cli -- plotter-preflight ci-plot.kdr
          cargo run --release -p opencorel-cli -- export-plt ci-plot.kdr ci-plot.plt
          grep -q '^IN;SP1;PA;' ci-plot.plt
          grep -q 'SP0;' ci-plot.plt
          cargo run --release -p opencorel-cli -- dxf-preflight ci-plot.kdr
          cargo run --release -p opencorel-cli -- export-dxf ci-plot.kdr ci-plot.dxf
          grep -q 'AC1015' ci-plot.dxf
          grep -q 'POLYLINE' ci-plot.dxf
          grep -q '^EOF$' ci-plot.dxf
          if cargo run --release -p opencorel-cli -- export-dxf ci-smoke.kdr ci-invalid.dxf; then
            echo 'DXF export unexpectedly allowed unoutlined text' >&2
            exit 1
          fi
          if cargo run --release -p opencorel-cli -- export-plt ci-smoke.kdr ci-invalid-cut.plt; then
            echo 'Plotter export unexpectedly allowed unoutlined text' >&2
            exit 1
          fi
          printf 'damaged file' > ci-invalid.kdr
          if cargo run --release -p opencorel-cli -- inspect ci-invalid.kdr; then
            echo 'Damaged native project was incorrectly accepted' >&2
            exit 1
          fi
          if cargo run --release -p opencorel-cli -- inspect ci-does-not-exist.kdr; then
            echo 'Missing file was incorrectly accepted' >&2
            exit 1
          fi
      - name: Validate DXF with independent ezdxf parser
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input ezdxf
          python - <<'PY'
          import ezdxf
          drawing = ezdxf.readfile("ci-plot.dxf")
          entities = list(drawing.modelspace())
          assert len(entities) == 1, f"expected one modelspace entity, got {len(entities)}"
          assert entities[0].dxftype() == "POLYLINE", entities[0].dxftype()
          assert entities[0].dxf.layer == "OC1_LAYER", entities[0].dxf.layer
          assert drawing.header.get("$INSUNITS") == 4, drawing.header.get("$INSUNITS")
          print("DXF parsed by ezdxf: one POLYLINE, layer OC1_LAYER, units=mm")
          PY
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: opencorel-${{ runner.os }}-x64
          path: |
            target/release/opencorel-desktop
            target/release/opencorel-desktop.exe
            target/release/opencorel-cli
            target/release/opencorel-cli.exe
          if-no-files-found: error
