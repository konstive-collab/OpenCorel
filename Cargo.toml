[workspace]
resolver = "2"
members = ["crates/core", "crates/desktop", "crates/cli", "crates/export", "crates/formats", "crates/typography"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/konstive-collab/OpenCorel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
